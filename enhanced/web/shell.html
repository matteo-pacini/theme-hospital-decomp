<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme Hospital Enhanced</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas#canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #status, #closed { position: fixed; left: 0; right: 0; font: 16px sans-serif; color: #ddd; text-align: center; }
  #status { top: 1em; display: none; }
  #closed { top: 40%; display: none; font-size: 20px; }
  #licence { position: fixed; right: 0; top: 0; z-index: 2; padding: 1px 5px; font: 10px sans-serif; color: #999; background: rgba(0, 0, 0, 0.5); }
  #licence a { color: #bcd; }
  #loading { position: fixed; top: 40%; left: 0; right: 0; font: 16px sans-serif; color: #888; text-align: center; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="loading">Loading…</div>
<div id="status"></div>
<div id="closed">The game is closed. Reload the page to play again.</div>
<div id="licence">Theme Hospital Enhanced v@PROJECT_VERSION@ · free software, GPL 3 (with xBRZ by Zenju):
  <a href="https://github.com/matteo-pacini/theme-hospital-enhanced/tree/v@PROJECT_VERSION@" target="_blank" rel="noopener">source</a>,
  <a href="https://github.com/matteo-pacini/theme-hospital-enhanced/blob/v@PROJECT_VERSION@/COPYING" target="_blank" rel="noopener">licence</a></div>
<script>
  // ?level=N starts that level at once; ?debug turns the developer tools on.
  var args = [];
  var query = new URLSearchParams(location.search);
  ['level', 'language'].forEach(function (key) {
    if (/^[0-9]+$/.test(query.get(key) || '')) args.push('--' + key, query.get(key));
  });
  if (query.has('debug')) args.push('--debug');
  // ?upscale=xbrz:4 (or off) preselects the setup screen's upscaling.
  if (/^(off|[a-z]+:[2-6])$/.test(query.get('upscale') || '')) args.push('--upscale', query.get('upscale'));
  var Module = {
    arguments: args,
    canvas: document.getElementById('canvas'),
    // A deployment names its files by content hash (tools/web_deploy.sh): it
    // sets thFiles, the plain names to the hashed ones.
    locateFile: function (name) {
      return (window.thFiles && window.thFiles[name]) || name;
    },
    print: function (text) { console.log(text); },
    printErr: function (text) { console.warn(text); },
    onRuntimeInitialized: function () {
      window.thReady = true;
      document.getElementById('loading').style.display = 'none';
    }
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
